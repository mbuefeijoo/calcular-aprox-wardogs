<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Artilleria - WARDOGS</title>
  <style>
    :root { color-scheme: dark; --ink: #edf2ed; --muted: #9eaaa3; --line: #344139; --panel: #172019; --panel-deep: #101711; --accent: #f1b83b; --accent-bright: #ffd46d; --danger: #ff8f7a; --focus: #8fd4aa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0a0f0b; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
    header { position: relative; padding: 0 0 26px 18px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
    header::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 29px; width: 4px; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); line-height: 1.08; letter-spacing: 0; }
    header p { margin: 9px 0 0; color: var(--muted); font-size: 15px; }
    .layout { display: block; }
    .calculator { padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 16px 42px rgba(0, 0, 0, .22); }
    h2 { font-size: 15px; line-height: 1; margin: 0 0 22px; color: var(--accent-bright); letter-spacing: .08em; text-transform: uppercase; }
    .coordinates { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    fieldset { min-width: 0; margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-deep); }
    legend { color: var(--ink); padding: 0 5px; font-size: 14px; font-weight: 700; }
    label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    input { width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #526159; border-radius: 4px; background: #090e0a; color: var(--ink); font: 600 16px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    input:focus { outline: 2px solid var(--focus); outline-offset: 2px; border-color: var(--focus); }
    button { width: 100%; margin-top: 20px; border: 1px solid #f8cf68; border-radius: 4px; background: var(--accent); color: #171204; cursor: pointer; font-size: 16px; font-weight: 800; letter-spacing: .02em; padding: 14px; transition: background-color .16s ease, transform .16s ease; }
    button:hover { background: var(--accent-bright); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 18px 0 0; }
    .result { margin-top: 22px; padding: 20px; border: 1px solid #6d5523; border-left: 4px solid var(--accent); border-radius: 5px; background: #15140d; }
    .result[hidden] { display: none; }
    .result.error { border-color: var(--danger); }
    .result h3 { margin: 0 0 16px; font-size: 13px; color: var(--accent-bright); letter-spacing: .08em; text-transform: uppercase; }
    .values { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .value { font-size: clamp(26px, 5vw, 34px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .label { display: block; color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.35; margin-top: 8px; }
    @media (max-width: 560px) { main { width: min(100% - 24px, 620px); padding: 28px 0 40px; } header { margin-bottom: 22px; padding-bottom: 21px; } header::before { bottom: 24px; } .calculator { padding: 20px; } .coordinates, .values { grid-template-columns: 1fr; } .values { gap: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Calculadora de artilleria</h1>
      <p>WARDOGS: rumbo y distancia entre dos coordenadas del mapa.</p>
    </header>
    <section class="layout">
      <div class="calculator">
        <h2>Coordenadas</h2>
        <div class="coordinates">
          <fieldset>
            <legend>Mi posicion</legend>
            <label for="origin">Coordenadas<input id="origin" value="x97.87, y109.47" autocomplete="off"></label>
          </fieldset>
          <fieldset>
            <legend>Objetivo</legend>
            <label for="target">Coordenadas<input id="target" value="x81.63, y83.17" autocomplete="off"></label>
          </fieldset>
        </div>
        <button id="calculate" type="button">Calcular tiro</button>
        <p class="hint">Pega el formato <strong>x89.94, y96.78</strong>. Se admite punto o coma decimal. Cada unidad son 100 m y no hay coordenadas negativas.</p>
        <section id="result" class="result" aria-live="polite" hidden></section>
      </div>
    </section>
  </main>
  <script>
    const getCoordinates = (id) => {
      const raw = document.getElementById(id).value.trim();
      const match = raw.match(/^\s*x\s*=?\s*(\d+(?:[.,]\d+)?)\s*,\s*y\s*=?\s*(\d+(?:[.,]\d+)?)\s*$/i);
      if (!match) throw new Error('Usa el formato x89.94, y96.78.');
      const x = Number(match[1].replace(',', '.'));
      const y = Number(match[2].replace(',', '.'));
      if (!Number.isFinite(x) || !Number.isFinite(y)) throw new Error('Introduce coordenadas validas.');
      return { x: x * 100, y: y * 100 };
    };

    const compass = (bearing) => {
      const names = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      return names[Math.round(bearing / 45) % 8];
    };

    function calculate() {
      const result = document.getElementById('result');
      try {
        const origin = getCoordinates('origin');
        const target = getCoordinates('target');
        const deltaX = target.x - origin.x;
        const deltaY = target.y - origin.y;
        const distance = Math.hypot(deltaX, deltaY);
        const bearing = (Math.atan2(deltaX, deltaY) * 180 / Math.PI + 360) % 360;
        result.classList.remove('error');
        result.innerHTML = `<h3>Solucion de tiro</h3><div class="values"><div>${bearing.toFixed(1)}&deg;<span class="label">Orientacion (${compass(bearing)})</span></div><div>${Math.round(distance).toLocaleString('es-ES')} m<span class="label">Distancia</span></div></div>`;
      } catch (error) {
        result.classList.add('error');
        result.innerHTML = `<h3>Error</h3><div>${error.message}</div>`;
      }
      result.hidden = false;
    }

    document.getElementById('calculate').addEventListener('click', calculate);
    document.querySelectorAll('input').forEach((input) => input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') calculate();
    }));
    calculate();
  </script>
</body>
</html>
