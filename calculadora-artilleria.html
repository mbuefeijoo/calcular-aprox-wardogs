<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Artilleria - WARDOGS</title>
  <style>
    :root { color-scheme: dark; --ink: #e8ede8; --muted: #aab3aa; --line: #425046; --panel: #172019; --accent: #d1a94c; --danger: #ff8a79; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d120e; color: var(--ink); font-family: Arial, sans-serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    header p { margin: 7px 0 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, .9fr); gap: 24px; align-items: start; }
    .calculator { padding: 24px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; }
    h2 { font-size: 17px; margin: 0 0 18px; }
    .coordinates { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    fieldset { min-width: 0; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 4px; }
    legend { color: var(--accent); padding: 0 6px; font-weight: 700; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    label + label { margin-top: 14px; }
    input { width: 100%; padding: 11px; border: 1px solid #627066; border-radius: 3px; background: #0d120e; color: var(--ink); font-size: 17px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    button { width: 100%; margin-top: 20px; border: 0; border-radius: 3px; background: var(--accent); color: #161208; cursor: pointer; font-size: 16px; font-weight: 700; padding: 13px; }
    button:hover { background: #e3bc5c; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 16px 0 0; }
    .result { margin-top: 20px; padding: 18px; border-left: 4px solid var(--accent); background: #101610; }
    .result[hidden] { display: none; }
    .result.error { border-color: var(--danger); }
    .result h3 { margin: 0 0 14px; font-size: 15px; color: var(--muted); }
    .values { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .value { font-size: 27px; font-weight: 700; }
    .label { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 4px; }
    .map { margin: 0; border: 1px solid var(--line); background: #050705; }
    .map img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 12px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) { main { width: min(100% - 24px, 620px); padding-top: 20px; } .layout { grid-template-columns: 1fr; } .coordinates { grid-template-columns: 1fr; } .map { order: -1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Calculadora de artilleria</h1>
      <p>WARDOGS: rumbo y distancia entre dos coordenadas del mapa.</p>
    </header>
    <section class="layout">
      <div class="calculator">
        <h2>Coordenadas</h2>
        <div class="coordinates">
          <fieldset>
            <legend>Mi posicion</legend>
            <label for="origin">Coordenadas<input id="origin" value="x97.87, y109.47" autocomplete="off"></label>
          </fieldset>
          <fieldset>
            <legend>Objetivo</legend>
            <label for="target">Coordenadas<input id="target" value="x81.63, y83.17" autocomplete="off"></label>
          </fieldset>
        </div>
        <button id="calculate" type="button">Calcular tiro</button>
        <p class="hint">Pega el formato <strong>x89.94, y96.78</strong>. Se admite punto o coma decimal. Cada unidad son 100 m y no hay coordenadas negativas.</p>
        <section id="result" class="result" aria-live="polite" hidden></section>
      </div>
      <figure class="map">
        <img src="wardogs-map.png" alt="Mapa de WARDOGS con ejes X e Y">
        <figcaption>Referencia del mapa. El rumbo usa 0 grados al norte y aumenta en sentido horario.</figcaption>
      </figure>
    </section>
  </main>
  <script>
    const getCoordinates = (id) => {
      const raw = document.getElementById(id).value.trim();
      const match = raw.match(/^\s*x\s*=?\s*(\d+(?:[.,]\d+)?)\s*,\s*y\s*=?\s*(\d+(?:[.,]\d+)?)\s*$/i);
      if (!match) throw new Error('Usa el formato x89.94, y96.78.');
      const x = Number(match[1].replace(',', '.'));
      const y = Number(match[2].replace(',', '.'));
      if (!Number.isFinite(x) || !Number.isFinite(y)) throw new Error('Introduce coordenadas validas.');
      return { x: x * 100, y: y * 100 };
    };

    const compass = (bearing) => {
      const names = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      return names[Math.round(bearing / 45) % 8];
    };

    function calculate() {
      const result = document.getElementById('result');
      try {
        const origin = getCoordinates('origin');
        const target = getCoordinates('target');
        const deltaX = target.x - origin.x;
        const deltaY = target.y - origin.y;
        const distance = Math.hypot(deltaX, deltaY);
        const bearing = (Math.atan2(deltaX, deltaY) * 180 / Math.PI + 360) % 360;
        result.classList.remove('error');
        result.innerHTML = `<h3>Solucion de tiro</h3><div class="values"><div>${bearing.toFixed(1)}&deg;<span class="label">Orientacion (${compass(bearing)})</span></div><div>${Math.round(distance).toLocaleString('es-ES')} m<span class="label">Distancia</span></div></div>`;
      } catch (error) {
        result.classList.add('error');
        result.innerHTML = `<h3>Error</h3><div>${error.message}</div>`;
      }
      result.hidden = false;
    }

    document.getElementById('calculate').addEventListener('click', calculate);
    document.querySelectorAll('input').forEach((input) => input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') calculate();
    }));
    calculate();
  </script>
</body>
</html>
